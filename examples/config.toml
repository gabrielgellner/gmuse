# gmuse configuration — $XDG_CONFIG_HOME/gmuse/config.toml
#
# NOTE: top-level keys must come BEFORE any [table] header. TOML attaches a
# bare key written after one to that table, so `active_catalogs` placed at the
# bottom of this file would be read as part of the last [catalogs.*] table.
#
# Settings and theming are declarative, so they are TOML tables. Key bindings
# hold *commands*, which are the same language the `:` line takes — so anything
# you can type at the prompt, you can bind.
#
# Unknown tables and settings are errors, not silence: a typo is reported with
# where it is, and the rest of the file still loads.

# Where your music is. This is the durable home for library roots — the cache
# is derived data and is discarded whenever its format changes, so roots that
# live only there are lost on an upgrade.
library = ["~/Music"]

# Run once at startup, after everything below is applied.
startup_commands = ["view 1"]

[settings]
shuffle = false
repeat = false
repeat_current = false
continue = true
smart_artist_sort = true    # sort "The Beatles" under B
album_headers = true        # divide track lists by album
relative_numbers = false    # vim-style distance gutter
aaa_mode = "all"            # all | artist | album
resample_quality = "balanced" # fast | balanced | high

# Catalogs are separate bodies of music. Browsing and shuffle stay inside the
# active ones; playlists and the queue cross them freely. Everything is scanned
# whatever is active, so switching is instant.
#
# A track belongs to a catalog when its path is under one of these roots.
# Tracks under no catalog at all still appear when everything is active.
#
# [catalogs.general]
# roots = ["~/Music/General"]
#
# [catalogs.electronica]
# roots = ["~/Music/Electronic", "~/Music/Ambient"]
#
# active_catalogs = ["general"]   # omit, or ["all"], for everything

# Where everything *you* have decided about your music lives: ratings, play
# history, and playlists. This is the half worth backing up, so it is a setting
# — point it inside your library and it travels with the music.
#
# Default: $XDG_DATA_HOME/gmuse (i.e. ~/.local/share/gmuse). It cannot default
# inside the library, because roots may be several and on different disks.
#
# The session and the audit log stay in $XDG_STATE_HOME whatever this says:
# losing where you were is not a loss.
#
# data_dir = "~/MusicLibrary/.gmuse"

# Smart playlists: a saved rule that fills view 3. `:playlist <name>` loads one.
#
# A catalog and a smart playlist can hold the same expression and still be
# different things. A catalog *narrows* — it hides everything outside itself,
# and shuffle cannot reach out. A smart playlist is a *source*: it fills view 3
# and leaves the library exactly as it was. "Show me only my jazz" is a
# catalog; "play my highly rated" is a smart playlist.
#
# Rule-defined lists are not editable — `:freeze` turns the loaded one into an
# ordinary playlist, which is.
#
# `sort` is a comma-separated list of field names, applied left to right, with
# `-` for descending. Keys are the names the filter and format languages use,
# plus `random`. Dates are the one place the two languages differ: a filter
# says `days_since_added`, a sort says `added`, because `-added` cannot be
# misread as oldest-first the way `-days_since_added` can. Each rejects the
# other by name.
#
# [playlists.fresh]
# where = "days_since_added<30"
# sort = "-added"                 # newest first
#
# [playlists.neglected]
# where = "play_count=0"
# sort = "random"
#
# [playlists.best]
# where = 'rating>=4&genre="*jazz*"'
# sort = "-rating, artist, album, track"

# Contexts: common, library, sorted, playlist, queue, browser, filters, settings
# A binding in a view's own context wins over the same key in `common`.
#
# Key names: a character, or space/enter/tab/backspace/delete/insert/home/end/
# pageup/pagedown/up/down/left/right/escape/f1-f12. Prefix with ^ for control
# and M- for alt.
# A key may be a chord, written space-separated. Note that a chord cannot
# extend an already-bound key: `z` is player-prev, so "z z" would never fire.
[keys.common]
"g g" = "win-top"
"g t" = "view-next"

# `in <pane> <command>` aims a command at a pane without moving focus, so you
# can step the tree while reading the track list.
"^j" = "in tree win-down"
"^k" = "in tree win-up"

# A single command.
"^n" = "player-next"
"^p" = "player-prev"

# A list is a macro, run in order — this queues the selection and skips to it.
o = ["add-queue", "player-next"]

# Anything the `:` line accepts works here.
"M-f" = "seek +30"
"M-b" = "seek -30"

[keys.playlist]
# Only in the playlist view: D removes, and here so does x.
x = "win-remove"

# Colours may be names ("cyan", "lightblue"), #rrggbb, or a palette entry
# defined below. A palette name wins over a colour name, so you can rename
# anything.
[theme.palette]
accent = "cyan"
muted = "darkgray"

# Styles name a role, not a widget, so a theme is data and the UI never names a
# colour. Anything you leave out keeps its default — a two-line theme is valid.
#
# Roles: tab_active tab_inactive border_focused border_unfocused
#        selection_focused selection_unfocused status_text status_dim
#        status_playing status_notice status_modes status_underrun
#        prompt_sigil setting_key binding_context binding_key
[theme.styles]
tab_active = { fg = "black", bg = "accent", mods = ["bold"] }
tab_inactive = { fg = "muted" }
border_focused = { fg = "accent" }
border_unfocused = { fg = "muted" }
selection_focused = { fg = "black", bg = "accent", mods = ["bold"] }
selection_unfocused = { mods = ["reversed", "dim"] }
status_playing = { fg = "green" }
status_underrun = { fg = "red" }
