# The Rust half of `just ci`, on every pull request.
#
# The quality gate is still local: `just ci`, enforced by the pre-push hook (`just
# hooks-install`). On GitLab this job ran only by hand, because a shared runner's free
# tier was 400 minutes a month and one day saw 41 commits land. A public GitHub
# repository's Actions minutes are free, so the reason is gone and the job runs on its
# own: a second look, on a clean machine, before a pull request merges.
#
# Not prettier or yamllint. Those are quick and the hook has already run them.

name: verify

"on":
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cmake is for the bundled libopus; ALSA is what cpal builds against on Linux.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
