# GitLab CI does nothing unless you start it by hand.
#
# The `workflow:` rules below mean **no pipeline is even created** for a push,
# a merge request, or a tag — only for a run you start yourself from
# CI/CD > Pipelines > "Run pipeline" (or via an API trigger). Marking jobs
# `when: manual` is not enough on its own: that still creates a pipeline per
# push, which shows up as noise in the MR and pipeline list.
#
# The quality gate is local: `just ci`, enforced by the pre-push hook
# (`just hooks-install`). A Rust job on a shared runner pays for apt-get, a
# rustup toolchain and a cold cargo registry before it compiles a line, only to
# repeat what the hook already ran — not worth the minutes for a solo project.
#
# This is a hosting decision, not a design one. Nothing about the test suite is
# shaped to fit a runner budget. When there are minutes to spend, add
#   - if: $CI_PIPELINE_SOURCE == "merge_request_event"
# to the workflow rules to get a check on every MR.

workflow:
  rules:
    # Started by hand from the UI.
    - if: $CI_PIPELINE_SOURCE == "web"
    # Started via an API trigger token.
    - if: $CI_PIPELINE_SOURCE == "trigger"
    # Started from the CLI: `glab ci run`.
    - if: $CI_PIPELINE_SOURCE == "api"
    # **A push creates nothing**, including a push to `main`.
    #
    # It did, briefly, so the docs could publish themselves. Measured over two runs:
    # **27 seconds each, billed as a minute**, against a free tier of 400 a month — and
    # this repository saw 41 commits land on `main` in a single day. Publishing on every
    # push would spend the budget rebuilding a book whose sources usually had not
    # changed.
    #
    # So the docs publish by hand, like everything else here. `just docs` builds them
    # locally in a second and needs no runner at all, which is where the loop belongs.
    - when: never

stages:
  - verify
  - deploy

# Runs automatically, but only inside a pipeline you started yourself.
#
# **Explicitly not on the push-to-`main` pipeline** the workflow rules now create for the
# docs. Without this rule, adding that trigger would have quietly turned every push to
# `main` into a full Rust build on a shared runner — which is the exact cost the comment
# at the top of this file exists to avoid.
verify:
  stage: verify
  rules:
    # Automatic inside a pipeline you started — starting one is the decision.
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_PIPELINE_SOURCE == "api"
  image: rust:1-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake curl >/dev/null
    - curl -fsSL https://just.systems/install.sh | bash -s -- --to /usr/local/bin
    - rustup component add rustfmt clippy
  script:
    # prettier is not in this image, so this is the Rust half of `just ci`.
    - cargo fmt --all -- --check
    - cargo clippy --all-targets --all-features -- -D warnings
    - cargo test --release
    - cargo build --release
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/
      - target/
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

# **The book** — #247. `docs/design/` rendered with mdBook, at the project's Pages URL.
#
# Cheap by construction: one binary download, no cargo build, no toolchain. The guard is
# the point of the last line — `mdbook build` reports a broken include as a warning and
# exits 0, so a book with a hole in it would otherwise publish itself.
pages:
  stage: deploy
  image: rust:1-slim
  rules:
    # **By hand, on `main` only.** Pages has one published copy, so building it from a
    # branch would publish a draft over the real thing.
    #
    # `when: manual` even inside a pipeline somebody started deliberately: starting one
    # to run `verify` is not the same as asking to publish, and the button is the
    # difference between the two.
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    - when: never
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl python3 >/dev/null
    - |
      curl -fsSL -o /tmp/mdbook.tar.gz \
        https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-musl.tar.gz
      tar -xzf /tmp/mdbook.tar.gz -C /usr/local/bin
    # **The diagrams need their own binary.** `mermaid.min.js` is 2.5 MB of vendored
    # javascript, generated rather than committed, and without this step mdBook's
    # `additional-js` points at files that are not there — it warns, exits 0, and
    # publishes pages whose diagrams are inert. `book_guard.py` counts them for exactly
    # that reason.
    - |
      curl -fsSL -o /tmp/mermaid.tar.gz \
        https://github.com/badboy/mdbook-mermaid/releases/download/v0.17.1/mdbook-mermaid-v0.17.1-x86_64-unknown-linux-musl.tar.gz
      tar -xzf /tmp/mermaid.tar.gz -C /usr/local/bin
  script:
    - python3 tools/build_book.py
    - mkdir -p public
    - cp docs/books/landing/index.html public/index.html
    - |
      for b in model interaction; do
        mdbook-mermaid install "docs/books/$b"
        mdbook build "docs/books/$b"
        python3 tools/book_guard.py "docs/books/$b/book"
        mv "docs/books/$b/book" "public/$b"
      done
    # **The landing page must survive the loop above**, which is the one way this could
    # publish a site with no way in.
    - test -s public/index.html
    - test -f public/model/index.html
    - test -f public/interaction/index.html
  artifacts:
    paths:
      - public
