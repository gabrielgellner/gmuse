# **A workspace, with the root still a package** — #213.
#
# `src/` does not move. The split is meant to be a rename, and relocating
# 84,000 lines into `crates/gmuse/` would bury that rename in a diff nobody can
# read. Members arrive one at a time as the boundaries are drawn.
[workspace]
members = [
  "crates/gmuse-ids",
  "crates/gmuse-lock",
  "crates/gmuse-programme",
  "crates/gmuse-library",
  "crates/gmuse-proto",
  "crates/gmuse-client",
  "crates/gmuse-engine",
]

[package]
name = "gmuse"
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Gabriel's MUSical Experience"
repository = "https://gitlab.com/gabrielgellner/gmuse"

[lib]
name = "gmuse"
# **`rlib` for the binary, `cdylib` for Python** — #197. One library, two
# consumers: `src/main.rs` links it as a Rust crate, and `gmuse_core` loads it
# as an extension module. Without the second, the tools have no door but files.
crate-type = ["rlib", "cdylib"]

[dependencies]
arc-swap = "1.7.1"
gmuse-ids = { path = "crates/gmuse-ids" }
gmuse-library = { path = "crates/gmuse-library" }
gmuse-programme = { path = "crates/gmuse-programme" }
gmuse-proto = { path = "crates/gmuse-proto" }
gmuse-client = { path = "crates/gmuse-client" }
gmuse-engine = { path = "crates/gmuse-engine" }
clap = { version = "4.6.6", features = ["derive", "env"] }
cpal = "0.18.2"
crossbeam-channel = "0.5.16"
crossterm = "0.29.0"
lofty = "0.25.1"
nucleo-matcher = "0.3"
postcard = { version = "1.1.3", features = ["use-std"] }
pyo3 = { version = "0.29.2", features = [
  "extension-module",
  "abi3-py311",
], optional = true }
ratatui = "0.30.2"
rtrb = "0.4.0"
rubato = "5.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "0.6.1", features = [
  # not enabled by default; defaults already give us opt-simd, all-meta,
  # adpcm, flac, mkv, ogg, pcm, vorbis and wav.
  "aac",
  "alac",
  "mp3",
  "isomp4",
] }
thiserror = "2.0.20"
toml = "1.1.4"
twox-hash = { version = "2.1.4", default-features = false, features = [
  "xxhash3_128",
  "std",
] }
unicode-normalization = "0.1.25"
uuid = { version = "1.26.0", features = ["v4", "v5", "serde"] }
walkdir = "2.5.0"

[dev-dependencies]
# The binary's own tests use `gmuse-library`'s fixtures; see that crate's
# `testing` feature for why they are not simply `#[cfg(test)]`.
gmuse-library = { path = "crates/gmuse-library", features = ["testing"] }

[features]
default = ["opus"]
# Opus support. Compiles and statically links libopus; needs `cmake` at build
# time. The only C dependency in the project.
# **Turned on in `gmuse-engine`, which is where the decoder lives** — #213. The
# adapter is no longer a direct dependency of this package: `--no-default-features`
# has to reach the crate that registers it, or it drops the flag and keeps the C
# dependency.
opus = ["gmuse-engine/opus"]
# **Where the memory goes, from inside the process** — #255.
#
# Installs an accounting `GlobalAlloc` and has the engine say what it is holding.
# Off by default and it must stay off: a counter on every allocation is two
# atomics a release build should not pay to answer a question nobody is asking
# at runtime, and `rt_guard` is explicit that the audio callback allocates
# nothing — so the callback pays nothing either way, but the decoder thread
# would.
#
# **A feature and not a flag**, because RSS cannot answer this. The measurement
# that opened #255 reasoned from `ps`, and it turns out RSS runs a steady 1.4x
# the live heap: a gigabyte in `btop` was 700 MB of program and 300 MB of pages
# the allocator had not given back.
measure-memory = ["gmuse-library/testing"]
# **The Python door** — #197. Off by default, so an ordinary `cargo build`
# neither needs a Python interpreter nor links against one; `maturin` turns it
# on. The tools speak to the library through this rather than through files.
python = ["dep:pyo3"]
