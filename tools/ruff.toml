# Same governance model as ../../sdmxlib: turn everything on, then subtract,
# with a written reason per subtraction. These are standalone scripts rather
# than a library, which changes what is *appropriate* — not how much is on.
#
# NOT `fix = true`, for sdmxlib's reason: a config-level fix flag means every
# bare `ruff check` silently rewrites the working tree.
indent-width = 4
line-length = 120
target-version = "py313"

[format]
docstring-code-format = true
docstring-code-line-length = 88
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[lint]
select = ["ALL"]
ignore = [
  # ── Docstring style conflicts (as sdmxlib) ────────────────────────────────
  "D203",   # one-blank-line-before-class — conflicts with D211
  "D213",   # multi-line-summary-second-line — conflicts with D212
  "COM812", # missing-trailing-comma — handled by the formatter
  "ISC001", # single-line-implicit-string-concatenation — same

  # ── Active development ────────────────────────────────────────────────────
  "TD",  # flake8-todos
  "FIX", # flake8-fixme

  # ── Not this project ──────────────────────────────────────────────────────
  "CPY001", # missing-copyright-notice
]

[lint.per-file-ignores]
# These are **scripts**, and three rules are about libraries rather than code
# quality. Deliberately narrow: `D` and `ANN` stay ON, because a tool that
# rewrites tags across 900 files is worth documenting and annotating.
#
# T201  — `print` is the entire user interface; there is no logger to reach for.
# INP001 — a directory of scripts is not an implicit namespace package.
# S603/S607 — every subprocess call here is a fixed argv to a known binary
#   (`ffprobe`, `security`) with no shell and no user-controlled program name.
#   The rules cannot see that, and the alternative is a suppression per site.
# TC003 — Typer builds the CLI by **reading annotations at runtime**, so a type
#   moved into a checking block is a type Typer cannot see. The rule would take
#   `Path` out of reach of the one thing that needs it most.
"*.py" = ["T201", "INP001", "S603", "S607", "TC003"]

# A test file is a different kind of code and two rules say so.
#
# S101 — `assert` is what a test *is*. The rule exists because an assert
#   vanishes under `-O`; a test run never uses it.
# D101 — a test class is a grouping, not an interface. The methods carry the
#   documentation, and every one that describes a real failure says so.
# RUF001 — the ambiguous characters are the *subject*. `Pan-Pot` against
#   `Pan‐Pot` differs by one U+2010 and that difference downgraded nine good
#   matches; a test proving they compare equal has to contain both.
# PLR2004 — a literal in a test is the case. `465_000` is the length
#   MusicBrainz returned for `Triton`; naming it would hide which run it came
#   from, which is the one thing the test is recording.
"tests/*.py" = ["S101", "D101", "RUF001", "PLR2004"]

[lint.pydocstyle]
convention = "google"


[lint.flake8-bugbear]
# `typer.Argument(...)` in a parameter default **is** Typer's interface: it is
# how a parameter's help text, default and validation are declared, and Typer
# reads it at import. B008 exists to catch a mutable default built by accident,
# which these are not — they are immutable descriptors, and ruff provides this
# setting for precisely this case rather than a suppression per parameter.
extend-immutable-calls = ["typer.Argument", "typer.Option"]
