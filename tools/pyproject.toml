[project]
name = "gmuse-tools"
version = "0.1.0"
description = "Out-of-tree passes that measure, enrich and identify a gmuse library"
requires-python = ">=3.13"
dependencies = [
    "mutagen>=1.47",
    "numpy>=2.0",
    "requests>=2.32",
    "typer>=0.15",
]

[project.scripts]
gmuse-tools = "gmuse_tools.cli:app"

[dependency-groups]
dev = ["ruff>=0.14", "pyrefly>=0.40", "pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gmuse_tools"]

[tool.pytest.ini_options]
# Tests live beside nothing else: they are the only thing in `tests/`, and the
# package is importable because `uv sync` installs it.
testpaths = ["tests"]
