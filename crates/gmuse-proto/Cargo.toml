[package]
name = "gmuse-proto"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "What crosses the socket: the envelope, the handshake, the errors"
repository = "https://gitlab.com/gabrielgellner/gmuse"

# **It MUST NOT depend on engine internals** (§4.3), which is why `gmuse-ids`
# exists: §7.6 wants ids on the wire to be real domain identities, and the only
# way to have both is for the identities to live somewhere below both crates.
# Nothing that decodes, plays, or reads a disk belongs on this list.
[dependencies]
gmuse-ids = { path = "../gmuse-ids" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
