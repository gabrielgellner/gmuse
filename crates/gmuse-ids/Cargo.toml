[package]
name = "gmuse-ids"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "What the catalogue's things are called, and what they are"
repository = "https://gitlab.com/gabrielgellner/gmuse"

# **Everything that can name an entity, and nothing that can read a file.**
#
# §4.3 says `gmuse-proto` must not depend on engine internals, and §7.6 wants
# wire ids to be real domain identities. Those conflict unless the ids live
# somewhere both the protocol and the library can reach, so this is that place
# — and its dependency list is the whole point of it existing. Adding anything
# that decodes, walks a disk or opens a socket here puts that thing on the
# wire crate's dependency graph, which is the failure this crate is shaped to
# prevent.
# **`testing` exposes the fixture helpers, and nothing else.**
#
# `copy::row_of_test` mints a deterministic row id so a test asserting an
# ordering asserts a real one (#86). It is behind a feature rather than
# `#[cfg(test)]` because the crates downstream need it in *their* tests, which
# is a different compilation.
[features]
testing = []

[dependencies]
# Already the project's convention for error enums (§12) and a proc macro, so
# it adds nothing to what a dependent links.
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.26.0", features = ["v4", "v5", "serde"] }

# **Tests only.** The round-trip tests check that an id survives the wire
# format; postcard is how the project writes one, and a dev-dependency does not
# reach anything that depends on this crate.
[dev-dependencies]
postcard = { version = "1.1.3", features = ["use-std"] }
# And #240's: the invariant is that an id survives the format the *protocol* parses
# into, which is `serde_json::Value` — and a `u128` does not fit in one. Nothing but a
# test needs this.
serde_json = "1.0.151"
