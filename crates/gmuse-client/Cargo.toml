[package]
name = "gmuse-client"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "The blocking socket client every view speaks through"
repository = "https://gitlab.com/gabrielgellner/gmuse"

# **Only the protocol.** §4.3: this is used by the TUI, the CLI and later the
# MCP adapter, so one implementation rather than three — and it can only stay
# one if it depends on nothing any of them has.
[dependencies]
gmuse-proto = { path = "../gmuse-proto" }
crossbeam-channel = "0.5.16"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
